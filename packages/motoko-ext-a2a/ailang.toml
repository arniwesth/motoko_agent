[package]
name = "sunholo/motoko_ext_a2a"
version = "0.2.2"
edition = "1"

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi", version = "8.0" }

[effects]
max = ["Net", "FS", "Env", "Rand", "IO", "Process", "AI", "SharedMem", "Clock", "Stream", "Trace"]

[exports]
modules = [
  "sunholo/motoko_ext_a2a/register",
  "sunholo/motoko_ext_a2a/a2a",
  "sunholo/motoko_ext_a2a/config",
  "sunholo/motoko_ext_a2a/types"
]
