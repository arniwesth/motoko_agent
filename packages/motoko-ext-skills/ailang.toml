[package]
name = "sunholo/motoko_ext_skills"
version = "0.1.0"
edition = "1"
ailang = ">=0.47.0"
description = "Skills for motoko: a SKILL.md folder under .motoko/skills, indexed in one Skill tool's description and loaded as that tool's result (037 ADR-001)"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/motoko_ext_skills/register",
  "sunholo/motoko_ext_skills/skills"
]

# The two compactors are dependencies of `a6b_test.ail` only (037 ADR-001 A6b
# runs the real compactors on a loaded skill). `skills.ail` imports neither.
[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi", version = "8.0" }
"sunholo/motoko_ext_compaction_structural" = { path = "../motoko-ext-compaction-structural", version = "1.1.0" }
"sunholo/motoko_ext_compaction_ai" = { path = "../motoko-ext-compaction-ai", version = "0.3.0" }

[effects]
max = ["IO", "Process", "FS", "AI", "Env", "Net", "SharedMem", "Clock", "Stream", "Rand", "Trace"]

[stability]
level = "experimental"
