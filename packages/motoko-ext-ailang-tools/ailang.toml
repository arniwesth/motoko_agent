[package]
name = "sunholo/motoko_ext_ailang_tools"
version = "0.1.0"
edition = "1"
ailang = ">=0.17.0"
description = "AILANG-aware file tools for motoko: an ailang check after every .ail write or edit, a whitespace-tolerant EditFile fallback, and (opt-in) compact-interface reads of dependency .ail modules."
license = "Apache-2.0"

[exports]
modules = ["sunholo/motoko_ext_ailang_tools/register", "sunholo/motoko_ext_ailang_tools/edits"]

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi", version = "8.0" }

[effects]
max = ["IO", "Process", "FS", "AI", "Env", "Net", "SharedMem", "Clock", "Stream", "Rand", "Trace"]

[stability]
level = "experimental"
