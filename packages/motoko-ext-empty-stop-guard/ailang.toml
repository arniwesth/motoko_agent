[package]
name = "sunholo/motoko_ext_empty_stop_guard"
version = "0.1.0"
edition = "1"
ailang = ">=0.26.0"
description = "Finalize hook guard that continues once a model returns an empty stop response"
license = "Apache-2.0"

[exports]
modules = [
  "sunholo/motoko_ext_empty_stop_guard/empty_stop_guard",
  "sunholo/motoko_ext_empty_stop_guard/register"
]

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi" }

[effects]
max = ["IO", "Env", "AI", "Net", "FS", "Process", "SharedMem", "Clock", "Stream"]

[metadata]
tags = ["motoko", "extension", "finalize", "guard"]
ai_summary = "Task-agnostic empty-stop guard for the motoko_agent finalize hook."
