[package]
name = "sunholo/motoko_ext_ai_compat"
version = "0.2.1"
edition = "1"
ailang = ">=0.21.0"
description = "AILANG v0.21+ std/ai compat shim. Re-exposes the fork's callStreamResult shape over std/ai.step."

# Effect ceiling matches the post-v0.21-migration norm (see motoko_ext_compaction_ai 0.2.0).
# std/ai's surface now declares FS (callImage), Process, etc.; widening from the v0.1.0 narrow
# set (AI/Stream/Net/IO) so any import std/ai (...) at all type-checks against the package max.
[effects]
max = ["AI", "IO", "Process", "FS", "Env", "Net", "SharedMem", "Clock", "Stream"]

[exports]
modules = ["sunholo/motoko_ext_ai_compat/ai_compat"]
