[package]
name = "sunholo/motoko_ext_abi"
version = "4.0"
edition = "1"
ailang = ">=0.17.0"
description = "ABI contract for motoko_agent extension packages: ExtensionHooks, ExtCtx, policy and decision types"
license = "Apache-2.0"

[exports]
modules = ["sunholo/motoko_ext_abi/types"]

[effects]
max = []

[metadata]
tags = ["motoko", "extension", "abi", "hooks", "plugin"]
ai_summary = "Stable ABI contract for motoko_agent extensions. Provides ExtensionHooks record, ExtCtx, BudgetPlan, ToolPolicyDecision, ToolHandleDecision, ResponseInterceptDecision, FinalizeDecision, and VerificationConfig types. All motoko-ext-* packages depend on this package. Bumping ExtensionHooks is a major version bump."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/motoko-ext-abi"
homepage = "https://ailang.sunholo.com/docs/packages/motoko-ext-abi"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 0.50

[stability]
level = "stable"
