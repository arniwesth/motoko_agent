[package]
name = "sunholo/motoko_ext_abi"
version = "7.2"
edition = "1"
ailang = ">=0.17.0"
description = "ABI contract for motoko_agent extension packages: Capability, ExtCtx, policy and decision types"
license = "Apache-2.0"

[exports]
modules = ["sunholo/motoko_ext_abi/types"]

[effects]
max = []

[metadata]
tags = ["motoko", "extension", "abi", "hooks", "plugin"]
ai_summary = "Stable ABI contract for motoko_agent extensions. 7.2 adds ExtCtx.finish_reason: the PROVIDER's finish reason for the step the context describes, empty when the context does not follow a provider result. It is what lets a finalize hook tell a response truncated at the output-token cap from a model that said nothing. Unlike every 7.x change before it this one is SOURCE-BREAKING for constructors: ExtCtx is a record, so all 37 literals in the tree gained a field. 7.1 adds the second and final ExitAction verb, PublishFile: an extension publishes a file it already wrote by rename, onto a destination it already owns, and BOTH paths must sit under a root the host resolves from its own environment (MOTOKO_EXIT_PUBLISH_ROOT) -- unset means no publish executes. Required expect_sha256 (lowercase hex, checked against the host's own hash of dest) is the generation precondition; there is no publish-if-absent mode. This is the consumer-bearing return of the PublishFile 7.0 dropped as a pair of free paths, and it is additive: the only in-tree matcher on ExitAction is exit_manifest.action_json, and the host skips action kinds it does not know. 7.0 adds the ExitIntent capability and the ExitAction data type: an extension declares what should happen when the SESSION ends, the host renders it to data at every turn end and executes it at clean exit, so no extension code and no IPC run in the exit path. 6.0 replaces the ExtensionHooks record with the Capability sum (register_with_config -> [Capability], wrapped by the host into ExtEntry { id, caps }; ADR-001 Phase B, B8). Provides Capability, ExtEntry, ExtRegistry, ExtCtx, BudgetPlan, ToolPolicyDecision, ToolHandleDecision, ResponseInterceptDecision, FinalizeDecision, and VerificationConfig types. 5.0 adds the WI-B2b world token: ExtWorld, AiStepOutcome, and the four hook outcome records (PreStepOutcome, ToolHandleOutcome, ResponseInterceptOutcome, FinalizeOutcome) that carry D1's successor state back out of a hook. All motoko-ext-* packages depend on this package. Bumping ExtensionHooks is a major version bump."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/motoko-ext-abi"
homepage = "https://ailang.sunholo.com/docs/packages/motoko-ext-abi"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 0.50

[stability]
level = "stable"
