[package]
name = "sunholo/motoko_ext_conformance"
version = "6.0.0"
edition = "1"
ailang = ">=0.26.0"

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi" }

[exports]
modules = [
  "sunholo/motoko_ext_conformance/invariants",
  "sunholo/motoko_ext_conformance/harness",
  "sunholo/motoko_ext_conformance/fixtures/reject_fixtures",
  "sunholo/motoko_ext_conformance/examples/completion_guard",
  "sunholo/motoko_ext_conformance/examples/config_catalog",
  "sunholo/motoko_ext_conformance/examples/repeat_failure_policy",
]

[effects]
max = ["AI", "IO", "Process", "FS", "Env", "Net", "SharedMem", "Clock", "Stream", "Trace"]
