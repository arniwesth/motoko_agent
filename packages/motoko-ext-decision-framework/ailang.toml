[package]
name = "sunholo/motoko_ext_decision_framework"
version = "0.2.2"
edition = "1"
ailang = ">=0.17.0"
description = "Tier-1 motoko extension: injects the four-decision ladder (extension-vs-script, modify-vs-create, publish-where, cascade-aware-self-publish) into the system prompt at every loop iteration. Opt-in via profile config; not in core."
license = "Apache-2.0"

[exports]
modules = ["sunholo/motoko_ext_decision_framework/register"]

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi" }

[effects]
max = []

[metadata]
tags = ["motoko", "extension", "decision-framework", "self-improvement", "policy"]
ai_summary = "Prompt-patch extension that injects the four-decision ladder (extension-vs-script, modify-vs-create, publish-where, cascade-aware-self-publish) into motoko's system prompt CONDITIONALLY — only when ctx.task references extension authoring / publishing / motoko self-modification. Pure substring keyword check; no FS, no LLM call, no per-step cost beyond a strcmp. Saves ~700 tokens per step on irrelevant tasks. Canonical example of the context-aware extension pattern (hooks fire every step with full ExtCtx; cheap pure checks gate the patch). Companion to planned motoko-ext-precreate-lint and motoko-ext-publish-guard."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/motoko-ext-decision-framework"
license_url = "https://github.com/sunholo-data/ailang-packages/blob/main/LICENSE"

[cascade]
max_cost_usd = 0.25

[stability]
level = "experimental"
