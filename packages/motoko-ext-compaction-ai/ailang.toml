[package]
name = "sunholo/motoko_ext_compaction_ai"
version = "0.3.0"
edition = "1"
ailang = ">=0.19.1"
description = "AI-powered conversation compaction extension for motoko_agent"
license = "Apache-2.0"

[dependencies]
"sunholo/motoko_ext_abi" = { path = "../motoko-ext-abi" }

[exports]
modules = ["sunholo/motoko_ext_compaction_ai/compaction_ai", "sunholo/motoko_ext_compaction_ai/register", "sunholo/motoko_ext_compaction_ai/types"]

[effects]
max = ["AI", "IO", "Process", "FS", "Env", "Net", "SharedMem", "Clock", "Stream"]

[metadata]
tags = ["motoko", "extension", "compaction", "ai", "context"]
ai_summary = "AI-powered conversation compaction extension. Uses a cheap model to summarize old turns when context fills up. Implements on_pre_step hook to compact message history."
repository = "https://github.com/sunholo-data/ailang-packages/tree/main/packages/motoko-ext-compaction-ai"
homepage = "https://ailang.sunholo.com/docs/packages/motoko-ext-compaction-ai"

[cascade]
max_cost_usd = 0.10
