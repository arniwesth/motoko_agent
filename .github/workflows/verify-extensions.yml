name: verify-extensions

# Catches two classes of AILANG version drift:
#
# 1. "Pin drift" (PR #16): the installer AILANG_REF lagged behind what
#    extensions actually required.
#
# 2. "Dev-build gap" (PR #33): PR was verified locally against a dev build
#    (v0.21.0-99-g...) while the released v0.22.0 had stricter type
#    checking that caught a missing ExtCtx.context_limit field.
#
# Fix: CI derives the AILANG version to build from ailang.toml's floor
# constraint (e.g. `ailang = ">=0.22.0"` → build v0.22.0). The floor and
# installer AILANG_REF must both be kept in sync — a
# mismatch causes this job to fail on the "versions must match" check.

on:
  # Run on EVERY PR (no paths filter). check_core type-checks all of src/**
  # against freshly-resolved registry deps, so a regression can come from a
  # source-only change OR from an upstream extension bump (e.g. motoko_ext_abi
  # adding a field to ExtCtx) that changes NO file in the PR. A paths filter
  # silently skipped those cases, so the maintainer became our smoke test.
  pull_request:
  push:
    branches: [main]
  # Nightly: catch upstream registry-dependency drift that breaks check_core
  # with no commit at all (the abi 2.2.0 / context_limit class of failure).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# JOBS, AND WHY THERE ARE FIVE. Until 2026-09-24 this workflow ran everything in
# one 20-minute job, and on a branch it never finished: measured cold that job is
# ~25 min of work locally and ~30-34 min here (CI runs this serial, compile-bound
# work about 1.15x slower than the dev box -- check_core: 139 s local, 160 s here).
# It died in "DST AILANG gates" every time, including at 2f3ee4d1 before the ABI
# 8.0 line. The targets were never the problem: all 15 gates pass cold in 644 s.
# The split gives each share its own runner and its own red check, so a failure
# names itself instead of arriving as "cancelled". Per-target cold measurements
# (local seconds) are in the job comments; each job re-pays ~2.5 min of setup
# through .github/actions/dst-setup, which is why the shares are grouped rather
# than one-job-per-target.

concurrency:
  group: verify-extensions-${{ github.ref }}
  cancel-in-progress: true

env:
  # The development trunk. main is a release mirror that main_dst is merged into
  # periodically, so anything keyed on "what is new" must compare against
  # main_dst -- see the new_contract_policy step.
  TRUNK: main_dst

jobs:
  # ~5 min: the fast signal. check_core type-checks all of src/core against
  # freshly-resolved deps, so it is the check that should fail first and alone.
  core:
    name: check_core + verify_extensions + smoke_no_delegated_storm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      - name: check_core (verify_extensions + type-check src/core/*.ail)
        env:
          # Refuse the skip: no binary is a red check here, not a quiet pass.
          DAGR_REQUIRED: '1'
        run: make check_core

      - name: smoke_no_delegated_storm (ohmy_pi=false across shipped profiles)
        run: make smoke_no_delegated_storm

  # ~10 min. The three heaviest DST gates, measured cold: terminal_trace 213 s,
  # smoke_driver 92 s, world_state 72 s. They are one job so the other twelve
  # are not held behind them.
  dst_gates_heavy:
    name: DST gates (heavy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      - name: DST AILANG gates — heavy
        run: make --keep-going terminal_trace smoke_driver world_state

  # ~8 min. The remaining twelve gates, 267 s cold together: phase_c_l1 65,
  # compaction_dst 59, profile_definition 47, driver_only 29, fault_catalogue 19,
  # event_vocabulary 17, conformance 13, ext_call_inventory(_selftest) 15,
  # attribution_table + profile_coverage + predicate_anchors 3.
  dst_gates_rest:
    name: DST gates (rest)
    runs-on: ubuntu-latest
    # 30, not 20, only while compaction_dst's five scripts are probed one step
    # each: if all five hang, 5 x ~3 min of probe plus phase_c_l1's re-run must
    # still leave the rest of the job time to report. Back to 20 on the fold.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      # ONE STEP PER TARGET, DELIBERATELY. As one `make --keep-going` line this
      # step ran past 20 minutes in CI against 267 s of the same twelve targets
      # measured cold locally (2026-09-24), while the heavy job came in at the
      # expected 1.29x of its local time. So one of these hangs HERE and not on
      # the dev box, and a single step reports that as a dead step with no name.
      # It is not new: the pre-split job died in the same place at 2f3ee4d1,
      # before the ABI 8.0 line. NOT a counter-example: main's scheduled run,
      # which an earlier version of this comment cited as finishing "the whole
      # job in 2.4 min". It does not run this job at all -- main is the release
      # mirror, months behind main_dst, and its workflow has ONE job with no DST
      # gates and no compaction_dst step (run 35990826715). There is no known
      # green run of these targets in CI to diff against.
      # Per-target steps cost nothing and make the next red say which target it
      # is. Fold them back into one line once the hang is found and fixed.
      #
      # 2026-09-24, run 36010382877: the split named it -- `compaction_dst` ran
      # past 20 min against 59 s cold locally, every later step pending behind
      # it. The target is five `ailang run` invocations, so the next split is
      # between those five: one step per script (the compaction_dst_* parts in
      # the Makefile), each under scripts/ci_hang_probe.sh. The probe lets a
      # script run 150 s -- the WHOLE target takes 59 s locally -- and past that
      # prints what the process tree is blocked on (wait channels, fds, stdin,
      # sockets, CPU sampled twice) and SIGQUITs ailang for a goroutine dump, so
      # a hang fails in minutes with a signature instead of as "cancelled".
      # Every later step runs `if: !cancelled()`, so one red names ALL of them.
      # phase_c_l1 is probed too: `phase_c_l1: compaction_dst` re-runs all five.
      - name: compaction_dst / compaction_policy_dst
        timeout-minutes: 4
        run: scripts/ci_hang_probe.sh 150 make compaction_dst_policy

      - name: compaction_dst / compaction_catalog_dst
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: scripts/ci_hang_probe.sh 150 make compaction_dst_catalog

      - name: compaction_dst / runtime_status_tool_dst
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: scripts/ci_hang_probe.sh 150 make compaction_dst_runtime_status

      - name: compaction_dst / scripted_cursor_probe
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: scripts/ci_hang_probe.sh 150 make compaction_dst_cursor_probe

      - name: compaction_dst / long_qwen_compaction_dst
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: scripts/ci_hang_probe.sh 150 make compaction_dst_long_qwen

      - name: conformance
        if: ${{ !cancelled() }}
        run: make conformance

      - name: phase_c_l1 (re-runs compaction_dst first)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: scripts/ci_hang_probe.sh 360 make phase_c_l1

      - name: profile_coverage
        if: ${{ !cancelled() }}
        run: make profile_coverage

      - name: profile_definition
        if: ${{ !cancelled() }}
        run: make profile_definition

      - name: driver_only
        if: ${{ !cancelled() }}
        run: make driver_only

      - name: fault_catalogue
        if: ${{ !cancelled() }}
        run: make fault_catalogue

      - name: event_vocabulary
        if: ${{ !cancelled() }}
        run: make event_vocabulary

      - name: attribution_table
        if: ${{ !cancelled() }}
        run: make attribution_table

      - name: predicate_anchors
        if: ${{ !cancelled() }}
        run: make predicate_anchors

      - name: ext_call_inventory
        if: ${{ !cancelled() }}
        run: make ext_call_inventory

      - name: ext_call_inventory_selftest
        if: ${{ !cancelled() }}
        run: make ext_call_inventory_selftest

  # ~11 min. The second coverage axis (WI-A17) plus smoke_parity: 334 s and
  # 108 s cold. check_core type-checks src/core and never runs its inline
  # tests; test_coverage runs every one of them, and stays its own red check so
  # a coverage regression is legible as itself.
  coverage:
    name: test_coverage + smoke_parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      - name: smoke_parity
        run: make smoke_parity

      - name: test_coverage (run every inline test under src/core)
        run: make test_coverage_selftest test_coverage

  # ~6 min: the seeded gate and the three verify ratchets (76 + 42 + 88 s cold),
  # plus the contract policy, which needs the full history its checkout fetches.
  verify:
    name: verify_core + mutations + classify + contract policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # new_contract_policy diffs against the PR base, which a depth-1
          # checkout does not have.
          fetch-depth: 0
      - uses: ./.github/actions/dst-setup

      - name: DST seeded gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DST_SEEDS=500 DST_BASE_SEED=$(date +%Y%m%d) make dst_seeded
          else
            DST_SEEDS=5 DST_BASE_SEED=1 make dst_seeded
          fi

      # Enforcing since MOT-130. verify_core no longer ticks a file that proves
      # nothing, and a `requires` with no `ensures` exits non-zero (ADR-001 §3).
      # A ratchet nothing reads is not a ratchet, so the advisory flag came off
      # in the same change that gave the gate something true to say. Contracts
      # the Z3 fragment rejects are reported as `blocked` and never fail here.
      - name: verify_core
        run: make verify_core

      # VERIFIED proves a contract holds of its body, not that it would notice
      # the body changing. This falsifies each guard contract by deleting a
      # disjunct and asserting VIOLATION (PLAN P5).
      - name: verify_mutations
        run: make verify_mutations

      # The class of each contract is computed by Z3 and pinned. This fails if
      # the tree and contracts.register disagree in either direction, including
      # a class edited by hand while the solver computes something else -- the
      # direction a hand-maintained register cannot check (ADR-001 §2).
      - name: verify_classify_check
        run: make verify_classify_check

      # Every new pure func in src/core carries a contract or a checked excuse.
      # Keyed on the incoming diff, not the tree. PRs compare with their base
      # branch; pushes compare with the pre-push commit (origin/main is already
      # at HEAD after checkout and would make every push look empty).
      #
      # TRUNK is main_dst, not main. main is a release mirror that main_dst is
      # periodically merged into, so it runs months behind: on 2026-08-30 it was
      # still at PR #78 while main_dst was at #177. A main_dst -> main
      # integration PR therefore diffs the whole trunk, and the gate that is
      # keyed on the diff *precisely because* ~1545 declarations predate the rule
      # (ADR-001 §4) turns back into the tree-wide gate it was designed not to
      # be -- PR #154 reported 1565 of 1577 "new" declarations unjustified, every
      # one of them old. Every commit on such a PR was already gated when it
      # landed on main_dst, so gate the trunk against itself and get the empty
      # diff that is the honest answer.
      - name: new_contract_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_HEAD" == "$TRUNK" ]]; then
              contract_base="origin/$TRUNK"
            else
              contract_base="origin/$PR_BASE"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            contract_base="$PUSH_BEFORE"
          else
            contract_base="origin/$TRUNK"
          fi
          echo "new_contract_policy base: $contract_base"
          make new_contract_policy BASE="$contract_base"

  dst_l2:
    name: dst_l2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install TUI dependencies
        working-directory: src/tui
        run: bun install --frozen-lockfile

      - name: Layer-2 DST
        run: make dst_l2
