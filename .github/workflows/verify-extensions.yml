name: verify-extensions

# Catches two classes of AILANG version drift:
#
# 1. "Pin drift" (PR #16): the installer AILANG_REF lagged behind what
#    extensions actually required.
#
# 2. "Dev-build gap" (PR #33): PR was verified locally against a dev build
#    (v0.21.0-99-g...) while the released v0.22.0 had stricter type
#    checking that caught a missing ExtCtx.context_limit field.
#
# Fix: CI derives the AILANG version to build from ailang.toml's floor
# constraint (e.g. `ailang = ">=0.22.0"` → build v0.22.0). The floor and
# installer AILANG_REF must both be kept in sync — a
# mismatch causes this job to fail on the "versions must match" check.

on:
  # Run on EVERY PR (no paths filter). check_core type-checks all of src/**
  # against freshly-resolved registry deps, so a regression can come from a
  # source-only change OR from an upstream extension bump (e.g. motoko_ext_abi
  # adding a field to ExtCtx) that changes NO file in the PR. A paths filter
  # silently skipped those cases, so the maintainer became our smoke test.
  pull_request:
  push:
    branches: [main]
  # Nightly: catch upstream registry-dependency drift that breaks check_core
  # with no commit at all (the abi 2.2.0 / context_limit class of failure).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: verify-extensions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_extensions:
    name: verify_extensions + check_core + smoke_no_delegated_storm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read AILANG floor from ailang.toml (single source of truth)
        id: pin
        run: |
          # Parse floor from: ailang = ">=X.Y.Z"
          version=$(grep -E '^ailang\s*=' ailang.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          if [[ -z "$version" ]]; then
            echo "::error::Could not parse ailang floor from ailang.toml" >&2
            exit 1
          fi
          ref="v${version}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "ailang.toml floor: $ref"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache: false

      - name: Build AILANG at pinned ref
        env:
          AILANG_REF: ${{ steps.pin.outputs.ref }}
        run: |
          set -euo pipefail
          src="$HOME/.local/share/ailang"
          git clone --depth 1 --branch "$AILANG_REF" \
            https://github.com/sunholo-data/ailang "$src"
          commit="$(git -C "$src" rev-parse HEAD)"
          build_time="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          ldflags="-X github.com/sunholo-data/ailang/internal/version.Version=${AILANG_REF}"
          ldflags="${ldflags} -X github.com/sunholo-data/ailang/internal/version.Commit=${commit}"
          ldflags="${ldflags} -X github.com/sunholo-data/ailang/internal/version.BuildTime=${build_time}"
          (cd "$src" && go build -ldflags "$ldflags" -o "$HOME/.local/bin/ailang" ./cmd/ailang)
          mkdir -p "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/ailang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Confirm ailang version
        run: ailang --version

      - name: Hydrate extension packages
        run: make CI=1 sync_packages

      - name: check_core (verify_extensions + type-check src/core/*.ail)
        run: make check_core

      - name: smoke_no_delegated_storm (ohmy_pi=false across shipped profiles)
        run: make smoke_no_delegated_storm

      - name: DST AILANG gates
        run: make --keep-going compaction_dst conformance phase_c_l1 terminal_trace world_state profile_coverage profile_definition driver_only fault_catalogue event_vocabulary attribution_table predicate_anchors ext_call_inventory ext_call_inventory_selftest smoke_driver

      - name: DST seeded gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DST_SEEDS=500 DST_BASE_SEED=$(date +%Y%m%d) make dst_seeded
          else
            DST_SEEDS=5 DST_BASE_SEED=1 make dst_seeded
          fi

      - name: smoke_parity
        run: make smoke_parity

      # The second coverage axis (WI-A17). check_core above type-checks
      # src/core and never runs its inline tests; this runs every one of them.
      # It is a separate step rather than another name in the DST gates list so
      # a coverage regression is legible as its own red check.
      - name: test_coverage (run every inline test under src/core)
        run: make test_coverage_selftest test_coverage

      # Enforcing since MOT-130. verify_core no longer ticks a file that proves
      # nothing, and a `requires` with no `ensures` exits non-zero (ADR-001 §3).
      # A ratchet nothing reads is not a ratchet, so the advisory flag came off
      # in the same change that gave the gate something true to say. Contracts
      # the Z3 fragment rejects are reported as `blocked` and never fail here.
      - name: verify_core
        run: make verify_core

      # VERIFIED proves a contract holds of its body, not that it would notice
      # the body changing. This falsifies each guard contract by deleting a
      # disjunct and asserting VIOLATION (PLAN P5).
      - name: verify_mutations
        run: make verify_mutations

  dst_l2:
    name: dst_l2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install TUI dependencies
        working-directory: src/tui
        run: bun install --frozen-lockfile

      - name: Layer-2 DST
        run: make dst_l2
