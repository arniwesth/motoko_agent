name: verify-extensions

# Catches two classes of AILANG version drift:
#
# 1. "Pin drift" (PR #16): the installer AILANG_REF lagged behind what
#    extensions actually required.
#
# 2. "Dev-build gap" (PR #33): PR was verified locally against a dev build
#    (v0.21.0-99-g...) while the released v0.22.0 had stricter type
#    checking that caught a missing ExtCtx.context_limit field.
#
# Fix: CI derives the AILANG version to build from ailang.toml's floor
# constraint (e.g. `ailang = ">=0.22.0"` → build v0.22.0). The floor and
# installer AILANG_REF must both be kept in sync — a
# mismatch causes this job to fail on the "versions must match" check.

on:
  # Run on EVERY PR (no paths filter). check_core type-checks all of src/**
  # against freshly-resolved registry deps, so a regression can come from a
  # source-only change OR from an upstream extension bump (e.g. motoko_ext_abi
  # adding a field to ExtCtx) that changes NO file in the PR. A paths filter
  # silently skipped those cases, so the maintainer became our smoke test.
  pull_request:
  push:
    branches: [main]
  # Nightly: catch upstream registry-dependency drift that breaks check_core
  # with no commit at all (the abi 2.2.0 / context_limit class of failure).
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      # The line guard's mutation gate (see `defaults` below). Dispatch with
      # this true and EVERY job must go red at its first run step, naming
      # line_guard, in that step's own time -- not wedge.
      line_guard_mutant:
        description: 'Mutgate: print one 1 MB line in every run step; every job must go red fast, naming line_guard'
        type: boolean
        default: false

# JOBS, AND WHY THERE ARE FIVE. Until 2026-09-24 this workflow ran everything in
# one 20-minute job, and on a branch it never finished: measured cold that job is
# ~25 min of work locally and ~30-34 min here (CI runs this serial, compile-bound
# work about 1.15x slower than the dev box -- check_core: 139 s local, 160 s here).
# It died in "DST AILANG gates" every time, including at 2f3ee4d1 before the ABI
# 8.0 line. The targets' run time was never the problem: all 15 gates pass cold
# in 644 s. (Where it died was one target's OUTPUT, found only after this split:
# see DST gates (rest) below.)
# The split gives each share its own runner and its own red check, so a failure
# names itself instead of arriving as "cancelled". Per-target cold measurements
# (local seconds) are in the job comments; each job re-pays ~2.5 min of setup
# through .github/actions/dst-setup, which is why the shares are grouped rather
# than one-job-per-target.

concurrency:
  group: verify-extensions-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by scripts/ci_guarded_shell.sh; empty unless dispatched as the mutant.
  LINE_GUARD_MUTANT: ${{ github.event.inputs.line_guard_mutant == 'true' && '1' || '' }}

# EVERY RUN STEP IN THIS FILE GOES THROUGH THE LINE GUARD. The GitHub runner
# spends time quadratic in a log line's length and services no timeout or
# cancel while inside one: a 1 MB line is half an hour of silence, and that is
# how DST gates (rest) died "cancelled" with no log for weeks (LEG-CI-COMPACTION;
# scripts/line_guard.sh has the measurements). scripts/ci_guarded_shell.sh runs
# each step exactly as `shell: bash` does -- bash -eo pipefail -- with stdout
# and stderr through line_guard.sh 16384 --strict, and pipefail on that pipe
# too, so a failing step can never be turned green by its filter. A line over
# 16384 characters is cut before the runner sees it and turns its step red with
# the reason. 16384 against what these jobs print, measured in CI (run
# 36020314940): the longest line in any run step is 553 characters (the heavy
# job), 4142 in the rest job only because compaction_dst's recipe cuts its own
# megabyte events there; dst-setup's steps, which this does not cover
# (composite-action steps take no workflow defaults), top out at 193.
#
# The path is relative to the workspace, so no step sets `working-directory:`;
# one that needs another directory `cd`s inside its script.
defaults:
  run:
    shell: bash scripts/ci_guarded_shell.sh {0}

jobs:
  # ~5 min: the fast signal. check_core type-checks all of src/core against
  # freshly-resolved deps, so it is the check that should fail first and alone.
  core:
    name: check_core + verify_extensions + smoke_no_delegated_storm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      - name: check_core (verify_extensions + type-check src/core/*.ail)
        env:
          # Refuse the skip: no binary is a red check here, not a quiet pass.
          DAGR_REQUIRED: '1'
        run: make check_core

      - name: smoke_no_delegated_storm (ohmy_pi=false across shipped profiles)
        run: make smoke_no_delegated_storm

  # ~10 min. The three heaviest DST gates, measured cold: terminal_trace 213 s,
  # smoke_driver 92 s, world_state 72 s. They are one job so the other twelve
  # are not held behind them.
  dst_gates_heavy:
    name: DST gates (heavy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      - name: DST AILANG gates — heavy
        run: make --keep-going terminal_trace smoke_driver world_state

  # ~8 min. The remaining twelve gates, 267 s cold together: phase_c_l1 65,
  # compaction_dst 59, profile_definition 47, driver_only 29, fault_catalogue 19,
  # event_vocabulary 17, conformance 13, ext_call_inventory(_selftest) 15,
  # attribution_table + profile_coverage + predicate_anchors 3.
  dst_gates_rest:
    name: DST gates (rest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      # ONE LINE AGAIN, because the hang is found and fixed (LEG-CI-COMPACTION).
      # For weeks this job ran past its budget and died "cancelled" with no log,
      # against 267 s of the same targets locally. Splitting it named
      # compaction_dst (run 36010382877), then long_qwen_compaction_dst among
      # its five scripts (runs 36014490004, 36014504002: the other four passed
      # in 1/7/58/3 s, that one sat 20+ min past its step's 4-minute timeout).
      # The script was never slow: with its output in a file it passes here in
      # 7 s at 1.7 GB RSS of 16 GB (runs 36018119963, 36018131861). What it
      # does is PRINT single lines of 838 KB and 1.05 MB, and the runner spends
      # time quadratic in a line's length -- measured here with no ailang at
      # all, one line of 64 KB 7 s, of 256 KB 104-129 s, of 1 MB past 30 min --
      # while servicing no timeout, no cancel and no read of the step's pipe.
      # It was never ABI 8.0's: the pre-split job died in the same place at
      # 2f3ee4d1. And main's scheduled run, once cited here as finishing "the
      # whole job in 2.4 min", is no baseline -- main was then a release mirror
      # that did not run this job at all (run 35990826715).
      #
      # The fix is in the Makefile: that recipe cuts its own lines at 4096.
      # The gate is the workflow's default shell (see `defaults` at the top),
      # which puts this line -- like every run step here -- through
      # scripts/line_guard.sh --strict, so the NEXT target that prints a line
      # over 16384 characters is a fast red that names the problem, not an
      # hour of silence. If a hang comes back that this does not explain,
      # split the line again and wrap each step in scripts/ci_hang_probe.sh,
      # which records a hang to files (uploaded under always()) instead of to
      # the pipe the runner may have stopped reading.
      - name: DST AILANG gates — rest
        run: |
          make --keep-going compaction_dst conformance phase_c_l1 profile_coverage \
            profile_definition driver_only fault_catalogue event_vocabulary \
            attribution_table predicate_anchors ext_call_inventory \
            ext_call_inventory_selftest

  # ~11 min. The second coverage axis (WI-A17) plus smoke_parity: 334 s and
  # 108 s cold. check_core type-checks src/core and never runs its inline
  # tests; test_coverage runs every one of them, and stays its own red check so
  # a coverage regression is legible as itself.
  coverage:
    name: test_coverage + smoke_parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/dst-setup

      - name: smoke_parity
        run: make smoke_parity

      - name: test_coverage (run every inline test under src/core)
        run: make test_coverage_selftest test_coverage

  # ~6 min: the seeded gate and the three verify ratchets (76 + 42 + 88 s cold),
  # plus the contract policy, which needs the full history its checkout fetches.
  verify:
    name: verify_core + mutations + classify + contract policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # new_contract_policy diffs against the PR base or the pre-push tip,
          # which a depth-1 checkout does not have.
          fetch-depth: 0
      - uses: ./.github/actions/dst-setup

      - name: DST seeded gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DST_SEEDS=500 DST_BASE_SEED=$(date +%Y%m%d) make dst_seeded
          else
            DST_SEEDS=5 DST_BASE_SEED=1 make dst_seeded
          fi

      # Enforcing since MOT-130. verify_core no longer ticks a file that proves
      # nothing, and a `requires` with no `ensures` exits non-zero (ADR-001 §3).
      # A ratchet nothing reads is not a ratchet, so the advisory flag came off
      # in the same change that gave the gate something true to say. Contracts
      # the Z3 fragment rejects are reported as `blocked` and never fail here.
      - name: verify_core
        run: make verify_core

      # VERIFIED proves a contract holds of its body, not that it would notice
      # the body changing. This falsifies each guard contract by deleting a
      # disjunct and asserting VIOLATION (PLAN P5).
      - name: verify_mutations
        run: make verify_mutations

      # The class of each contract is computed by Z3 and pinned. This fails if
      # the tree and contracts.register disagree in either direction, including
      # a class edited by hand while the solver computes something else -- the
      # direction a hand-maintained register cannot check (ADR-001 §2).
      - name: verify_classify_check
        run: make verify_classify_check

      # Every new pure func in src/core carries a contract or a checked excuse.
      # Keyed on the incoming diff, not the tree: ~1545 declarations predate the
      # rule (ADR-001 §4). So the base is the tip the change is being added to:
      #
      #  * pull_request -- origin/<base_ref>: what the PR adds to its target,
      #    a PR stacked onto another branch included.
      #  * push (fires on main only) -- github.event.before, main's tip before
      #    this push: what the push adds to the trunk. A merged PR is gated
      #    again as it lands, and a direct push is gated at all. NOT origin/main:
      #    after checkout that IS the pushed commit, the diff is empty, and every
      #    push passes whatever it lands.
      #  * schedule / workflow_dispatch -- origin/main. A scheduled run is on
      #    main, so its diff is empty and it prints so; it is here for upstream
      #    drift, not this gate. A dispatch on a branch gets what it adds to main.
      #
      # event.before is all zeros when the push CREATED the branch. After a
      # force-push it names a commit no ref reaches, which this clone lacks; it
      # is fetched by SHA, and the three-dot diff from there is right. If that
      # fetch fails too, or before is all zeros, there is no previous tip to
      # diff against, so the pushed tip is gated against its first parent,
      # HEAD~1, and the step says so: for a PR's merge commit that is the whole
      # PR, otherwise the last commit. Neither a silent pass nor "cannot resolve
      # base ref".
      #
      # Until 2026-09-25 main was a release mirror of a separate trunk, main_dst,
      # and this step compared with main_dst. That branch is retired (#154 merged
      # it); main is the trunk. Do not route a push to origin/<the branch it
      # pushed to>: that is the empty diff above, a gate that cannot go red.
      - name: new_contract_policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              contract_base="origin/$PR_BASE" ;;
            push)
              contract_base="$PUSH_BEFORE"
              no_tip=""
              if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
                no_tip="event.before is all zeros: this push created $GITHUB_REF_NAME"
              elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null \
                   && ! git fetch --no-tags --quiet origin "$PUSH_BEFORE" 2>/dev/null; then
                no_tip="event.before $PUSH_BEFORE is not fetchable (orphaned by a force-push)"
              fi
              if [[ -n "$no_tip" ]]; then
                echo "new_contract_policy: $no_tip, so there is no previous tip to diff against;"
                echo "  gating the pushed tip against its first parent, HEAD~1 = $(git rev-parse HEAD~1)"
                contract_base="HEAD~1"
              fi ;;
            *)
              contract_base="origin/main" ;;
          esac
          echo "new_contract_policy base: $contract_base"
          make new_contract_policy BASE="$contract_base"

  dst_l2:
    name: dst_l2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # `cd` rather than `working-directory:`, which would move the relative
      # path of the default shell (see `defaults` at the top) out from under it.
      - name: Install TUI dependencies
        run: cd src/tui && bun install --frozen-lockfile

      - name: Layer-2 DST
        run: make dst_l2
