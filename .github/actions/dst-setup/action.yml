name: dst-setup
description: >
  The toolchain every DST/verify job needs: the AILANG build at the floor
  ailang.toml declares, Z3 (without it every `ailang verify` module errors),
  the hydrated extension packages, and the pinned dagr the contract leg checks
  against. Extracted from verify-extensions.yml when that workflow's single job
  outgrew its 20-minute box (measured 2026-09-24: ~25 min of work locally,
  ~30-34 min in CI). Each job pays this ~2.5 min once and then runs its own
  share in parallel.

runs:
  using: composite
  steps:
    - name: Read AILANG floor from ailang.toml (single source of truth)
      id: pin
      shell: bash
      run: |
        # Parse floor from: ailang = ">=X.Y.Z"
        version=$(grep -E '^ailang\s*=' ailang.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
        if [[ -z "$version" ]]; then
          echo "::error::Could not parse ailang floor from ailang.toml" >&2
          exit 1
        fi
        ref="v${version}"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "ailang.toml floor: $ref"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.5'
        cache: false

    - name: Build AILANG at pinned ref
      shell: bash
      env:
        AILANG_REF: ${{ steps.pin.outputs.ref }}
      run: |
        set -euo pipefail
        src="$HOME/.local/share/ailang"
        git clone --depth 1 --branch "$AILANG_REF" \
          https://github.com/sunholo-data/ailang "$src"
        commit="$(git -C "$src" rev-parse HEAD)"
        build_time="$(date -u '+%Y-%m-%d_%H:%M:%S')"
        ldflags="-X github.com/sunholo-data/ailang/internal/version.Version=${AILANG_REF}"
        ldflags="${ldflags} -X github.com/sunholo-data/ailang/internal/version.Commit=${commit}"
        ldflags="${ldflags} -X github.com/sunholo-data/ailang/internal/version.BuildTime=${build_time}"
        (cd "$src" && go build -ldflags "$ldflags" -o "$HOME/.local/bin/ailang" ./cmd/ailang)
        mkdir -p "$HOME/.local/bin"
        chmod +x "$HOME/.local/bin/ailang"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Confirm ailang version
      shell: bash
      run: ailang --version

    # `ailang verify` shells out to Z3; without it EVERY module errors. That
    # went unnoticed for as long as verify_core ran under continue-on-error,
    # which discarded the exit code -- so the target has never actually
    # verified anything here. Installing the solver is what makes the step
    # mean what its name says. scripts/install-prerequisites.sh names z3 for
    # the same reason; this job builds ailang directly and so must too.
    - name: Install Z3
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends z3
        z3 --version

    - name: Hydrate extension packages
      shell: bash
      run: make CI=1 sync_packages

    # verify_dagr_producer's contract leg -- the ONLY place a published dagr
    # document is checked against the real schema -- runs only if a dagr
    # binary is on PATH, and skips green otherwise. No step installed one, so
    # that leg had never run in CI. Herdr is not installed here either, so
    # this fetches the same checksum-verified release asset the plugin's own
    # install.sh would, at the pin the Makefile names. DAGR_REQUIRED=1 on the
    # check_core step is the other half: without it, a fetch that quietly
    # failed would put the skip back and CI would be green for a check that
    # did not run.
    - name: Install pinned dagr (the contract checker)
      shell: bash
      run: |
        set -euo pipefail
        version=$(sed -nE 's/^DAGR_VERSION \?= ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Makefile | head -n1)
        if [[ -z "$version" ]]; then
          echo "::error::Could not parse DAGR_VERSION from Makefile" >&2
          exit 1
        fi
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64)               target="x86_64-unknown-linux-musl" ;;
          Linux-aarch64 | Linux-arm64) target="aarch64-unknown-linux-musl" ;;
          *)
            echo "::error::no pinned dagr build for $(uname -s)-$(uname -m)" >&2
            exit 1
            ;;
        esac
        base="https://github.com/aemrebarut/herdr-dagr/releases/download/v${version}"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          "$base/dagr-$target.tar.gz" -o "$tmp/dagr.tar.gz"
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          "$base/dagr-$target.sha256" -o "$tmp/dagr.sha256"
        expected=$(awk 'NR == 1 {print $1}' "$tmp/dagr.sha256")
        actual=$(sha256sum "$tmp/dagr.tar.gz" | awk '{print $1}')
        if [[ "$expected" != "$actual" ]]; then
          echo "::error::dagr checksum mismatch (expected $expected, got $actual)" >&2
          exit 1
        fi
        tar -xzf "$tmp/dagr.tar.gz" -C "$tmp"
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$tmp/dagr" "$HOME/.local/bin/dagr"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/dagr" --version
