# egress-proxy policy for agent_confined — forward proxy on :3128.
# (Placed at .devcontainer/agent_confined/squid.conf; the compose service mounts it read-only.)
#
# PURPOSE: the confined agent has no direct route off-box (it is on an internal-only network); this proxy
# is its single exit. Policy below: forward to ALL PUBLIC hosts, but DENY every private/reserved range, so
# the agent cannot reach any private network the host may be attached to (VPN, mesh/overlay networks, the
# LAN, or the container host). Public egress (GitHub, package registries, model APIs) is intentionally left
# open. To lock egress down to a named allowlist later, enable the STRICT ALLOWLIST block near the bottom —
# no other file changes needed.

http_port 3128
visible_hostname egress-proxy   # without this squid can refuse to start ("cannot determine hostname")

# NO PID FILE. squid runs in the foreground under docker (-N), so nothing consumes a pid file — and on a
# read-only rootfs an unwritable /run makes squid exit `FATAL: failed to open /run/squid.pid` and, with
# `restart: unless-stopped`, crash-loop: the proxy name resolves intermittently and every client sees a
# hang rather than a refusal. `none` removes that failure class outright. (Every other path squid writes —
# cache.log, coredump_dir — degrades to stdout instead of being fatal; the pid file was the only fatal one.)
pid_filename none

# THE LOG DESTINATION MUST BE WRITABLE, OR SQUID DIES. This is what crash-looped the proxy, and it is
# worth stating plainly because nothing about the symptom points here. MEASURED against squid 6.14: an
# access log that cannot be opened is FATAL, whichever module writes it —
#     daemon: (the default, a HELPER process)  ->  helper dies, master takes EPIPE:
#                 ERROR: logfileHandleWrite: daemon:/var/log/squid/access.log ((32) Broken pipe)
#                 FATAL: I don't handle this error well!
#     stdio:  (written by the master itself)   ->  FATAL: Cannot open '...' for writing.
# Both end in `Terminated abnormally`, exit 1, and with `restart: unless-stopped` a crash loop. A
# crash-looping container is dropped from Docker's embedded DNS, so `egress-proxy` stops resolving and
# every client reports a HANG (ETIMEOUT, curl http_code 000) — never "the proxy is down".
#
# The image ships /var/log/squid owned by uid 13 (proxy), which is the user squid drops to, and declares
# it as a VOLUME. docker-compose.yml therefore must NOT mount a tmpfs over it: a Docker tmpfs is
# ROOT-owned, and after the privilege drop squid cannot create a file in it. See the comment on the
# egress-proxy service.
#
# `stdio:` rather than the default `daemon:` because it writes from the master process — one helper fewer
# to lose. The image's entrypoint tails these files to stdout, so they still land in `docker logs`.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

# NO ICMP PINGER. /usr/lib/squid/pinger ships `-rwsr-xr-x root root` — SETUID ROOT — and this service sets
# `no-new-privileges:true`, which is precisely the flag that stops a setuid binary from gaining anything.
# So it can never open its raw sockets and logs `FATAL: Unable to open any ICMP sockets` on every start.
# That FATAL is confined to the helper (the crash above reproduced with no pinger present at all), but it
# is pure noise in the logs of a policy gate that has no sibling caches to measure RTT to.
pinger_enable off

# This is a policy gate, not a cache.
cache deny all
coredump_dir /var/spool/squid

# --- the private/reserved space the agent must NOT reach -------------------------------------------------
# squid resolves the CONNECT hostname and matches on the IP it is about to connect to, so a name that
# resolves into private space (or a DNS-rebinding attempt) is denied just as an IP literal is.
acl to_private dst 100.64.0.0/10          # CGNAT (RFC 6598) — also the range mesh/overlay VPNs use
acl to_private dst 10.0.0.0/8
acl to_private dst 172.16.0.0/12
acl to_private dst 192.168.0.0/16
acl to_private dst 169.254.0.0/16         # link-local incl. cloud metadata 169.254.169.254
acl to_private dst 0.250.250.0/24         # container-host address block (host-only services live here — blocked on purpose)
acl to_private dst 127.0.0.0/8
acl to_private dst ::1/128
acl to_private dst fc00::/7               # IPv6 ULA
acl to_private dst fe80::/10             # IPv6 link-local

# --- port hygiene ----------------------------------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# ==== policy (first match wins) ==========================================================================
# 1) never reach private/reserved space — this is the boundary
http_access deny to_private
# 2) CONNECT (TLS tunnels) only to 443
http_access deny CONNECT !SSL_ports
# 3) no odd ports
http_access deny !Safe_ports

# --- STRICT ALLOWLIST (disabled now) ---------------------------------------------------------------------
# Uncomment this whole block to switch from "block private, allow all public" to "allow ONLY these hosts".
# Nothing else needs to change. `dstdomain` with a leading dot matches the domain and all subdomains.
#
# acl allowed dstdomain .github.com api.github.com codeload.github.com .githubusercontent.com
# acl allowed dstdomain registry.npmjs.org herdr.dev
# acl allowed dstdomain api.openai.com openrouter.ai api.anthropic.com generativelanguage.googleapis.com
# acl allowed dstdomain .amazonaws.com api.deepinfra.com api.fireworks.ai huggingface.co api.exa.ai
# acl allowed dstdomain mcp.ailang.sunholo.com mcp.linear.app
# http_access deny !allowed
#
# ---------------------------------------------------------------------------------------------------------

# 4) CURRENT permissive default: anything not private, on a safe port, is allowed
http_access allow all
http_access deny all
