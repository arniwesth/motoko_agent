<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #333; stroke-width: 1.4; }
    .core { fill: #f2f2f2; stroke: #333; stroke-width: 1.8; }
    .hd { font-size: 14px; font-weight: bold; fill: #111; }
    .tx { font-size: 12px; fill: #333; }
    .sm { font-size: 11px; fill: #555; font-style: italic; }
    .lbl { font-size: 11px; fill: #333; font-weight: bold; }
    .ln { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
  </style>

  <!-- Row 1: two wirings -->
  <rect class="box" x="30" y="20" width="330" height="92" rx="6"/>
  <text class="hd" x="195" y="44" text-anchor="middle">Production wiring</text>
  <text class="tx" x="195" y="64" text-anchor="middle">live_ports &#183; live model provider</text>
  <text class="tx" x="195" y="80" text-anchor="middle">OS clock &#183; process env &#183; real approvals</text>
  <text class="sm" x="195" y="98" text-anchor="middle">nondeterministic, unreproducible</text>

  <rect class="box" x="400" y="20" width="330" height="92" rx="6"/>
  <text class="hd" x="565" y="44" text-anchor="middle">Deterministic wiring</text>
  <text class="tx" x="565" y="64" text-anchor="middle">scripted provider / ports / hook fakes (pure)</text>
  <text class="tx" x="565" y="80" text-anchor="middle">or the seeded world (&#167;5): faults &#183; virtual clock</text>
  <text class="sm" x="565" y="98" text-anchor="middle">a function of the seed; narrowest caps that pass</text>

  <!-- Arrows into ports boundary -->
  <path class="ln" d="M 195 112 L 195 150 L 360 150"/>
  <path class="ln" d="M 565 112 L 565 150 L 400 150"/>
  <text class="lbl" x="248" y="143">swap the ports&#8230;</text>

  <!-- Ports boundary -->
  <rect class="box" x="240" y="164" width="280" height="44" rx="6"/>
  <text class="hd" x="380" y="184" text-anchor="middle">Ports boundary</text>
  <text class="sm" x="380" y="200" text-anchor="middle">one boundary for every external observation</text>
  <path class="ln" d="M 380 150 L 380 164"/>

  <!-- Core -->
  <rect class="core" x="150" y="232" width="460" height="108" rx="6"/>
  <text class="hd" x="380" y="256" text-anchor="middle">Real transition code (identical in both wirings)</text>
  <text class="tx" x="380" y="278" text-anchor="middle">decide : StepState &#8594; StepDecision  (pure)</text>
  <text class="tx" x="380" y="296" text-anchor="middle">model / tool / hook phases  (ports-only &#8594; PhaseResult + StateDelta)</text>
  <text class="tx" x="380" y="314" text-anchor="middle">session driver &#8212; threads state, executes decisions</text>
  <text class="sm" x="380" y="331" text-anchor="middle">sole emitter of ledger events</text>
  <path class="ln" d="M 380 208 L 380 232"/>
  <text class="lbl" x="392" y="226">&#8230;keep the code&#8230;</text>

  <!-- Ledger -->
  <rect class="box" x="240" y="366" width="280" height="48" rx="6"/>
  <text class="hd" x="380" y="386" text-anchor="middle">Typed LedgerTrace</text>
  <text class="tx" x="380" y="404" text-anchor="middle">projected to schema-v1 JSONL on the wire</text>
  <path class="ln" d="M 380 340 L 380 366"/>
  <text class="lbl" x="392" y="359">&#8230;read the ledger</text>

  <!-- Oracle row -->
  <rect class="box" x="30" y="446" width="330" height="88" rx="6"/>
  <text class="hd" x="195" y="470" text-anchor="middle">Structural invariants</text>
  <text class="tx" x="195" y="490" text-anchor="middle">pairing &#183; ordering &#183; chains &#183; conservation</text>
  <text class="tx" x="195" y="506" text-anchor="middle">never final model prose</text>
  <text class="sm" x="195" y="523" text-anchor="middle">12 families &#183; 37 named violations (&#167;5)</text>

  <rect class="box" x="400" y="446" width="330" height="88" rx="6"/>
  <text class="hd" x="565" y="470" text-anchor="middle">Replay comparison &amp; failure contract</text>
  <text class="tx" x="565" y="490" text-anchor="middle">normalized record comparison (strict replay)</text>
  <text class="tx" x="565" y="506" text-anchor="middle">failure = scenario id + seed + trace</text>
  <text class="sm" x="565" y="523" text-anchor="middle">the reproduction key is the public contract</text>

  <path class="ln" d="M 320 414 L 240 446"/>
  <path class="ln" d="M 440 414 L 520 446"/>
</svg>
